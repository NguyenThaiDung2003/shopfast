# CD: CI xanh → đẩy image tag SHA lên GHCR → dời tag `production` → EC2 tự kéo và deploy (ADR-0014).
# Không có secret nào ngoài GITHUB_TOKEN tạm thời của lần chạy. Job báo fail nếu bản mới không lên
# production: deploy lỗi hoặc rollback đều khiến /health/live không báo đúng SHA.
name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      REGISTRY: ghcr.io/nguyenthaidung2003
      PRODUCTION_URL: https://shopfast-ntd.id.vn
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/shopfast-api:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=api
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/shopfast-web:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=web
      - name: Dời tag production
        run: |
          git tag -f production "$SHA"
          git push -f origin refs/tags/production
      - name: Chờ production chạy đúng SHA
        run: |
          deadline=$((SECONDS + 300))
          while [ "$SECONDS" -lt "$deadline" ]; do
            if curl -fsS -m 5 "$PRODUCTION_URL/health/live" | grep -q "\"commit\":\"$SHA\""; then
              echo "Production đang chạy $SHA"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Sau 5 phút production chưa chạy $SHA. Xem /var/log/shopfast/deploy-pull.log và infra/.deploy/deploy.log trên server"
          exit 1
