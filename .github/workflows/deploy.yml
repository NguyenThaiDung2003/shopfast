# CD: CI xanh → build image tag theo SHA → chuyển vào EC2 qua SSH → deploy blue-green (ADR-0014, ADR-0015).
# Cấu hình ở GitHub: Secret DEPLOY_SSH_KEY; Variables AWS_ROLE_ARN, AWS_REGION, EC2_HOST, EC2_SG_ID,
# EC2_KNOWN_HOSTS. Thiết lập theo infra/aws/README.md.
name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Không đặt `environment`: nó đổi claim `sub` của OIDC, role sẽ từ chối.
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: production
      cancel-in-progress: false
    env:
      EC2_SG_ID: ${{ vars.EC2_SG_ID }}
      SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/api/Dockerfile
          load: true
          tags: shopfast-api:${{ github.sha }}
          cache-from: type=gha,scope=api
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile
          load: true
          tags: shopfast-web:${{ github.sha }}
          cache-from: type=gha,scope=web
      - name: Cấu hình SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ vars.EC2_KNOWN_HOSTS }}
          EC2_HOST: ${{ vars.EC2_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          (umask 077 && printf '%s\n' "$DEPLOY_SSH_KEY" >~/.ssh/deploy_key)
          printf '%s\n' "$EC2_KNOWN_HOSTS" >~/.ssh/known_hosts
          cat >~/.ssh/config <<EOF
          Host ec2
            HostName $EC2_HOST
            User ubuntu
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            ConnectTimeout 15
            ConnectionAttempts 4
            ServerAliveInterval 20
          EOF
      - name: Mở cổng 22 cho runner
        run: infra/scripts/ci-sg.sh open
      - name: Chuyển image vào EC2
        run: docker save "shopfast-api:$SHA" "shopfast-web:$SHA" | gzip -1 | ssh ec2 load-images
      - name: Deploy blue-green
        run: ssh ec2 deploy "$SHA"
      - name: Đóng cổng 22
        if: always()
        run: infra/scripts/ci-sg.sh close
