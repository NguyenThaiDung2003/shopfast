# Reverse proxy cho API (đặt trong khối `server { ... }` của Nginx).
#
# Rate limit (ADR-0008) đếm theo IP thật của client. API đặt TRUST_PROXY=1 = tin đúng 1 proxy
# (Nginx này): Express lấy phần tử CUỐI của X-Forwarded-For, tức IP mà Nginx thấy.
# - Thêm proxy phía trước (CDN, load balancer) → tăng TRUST_PROXY tương ứng, hoặc dùng
#   real_ip_module để Nginx tự lấy IP thật rồi giữ TRUST_PROXY=1.
# - TRUST_PROXY lớn hơn số proxy thật → client tự ghi X-Forwarded-For là đổi được IP, lách hạn mức.
# - API không được phơi cổng trực tiếp ra Internet (chỉ mạng nội bộ với Nginx).

location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    # Nối IP client vào cuối chuỗi client gửi lên; API chỉ tin phần tử cuối này.
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Bull Board (F05, ADR-0009): nằm ngoài /api, API tự kiểm quyền ADMIN (Bearer hoặc cookie phiên
# đặt bởi POST /api/admin/queues/session).
location /admin/queues/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Realtime theo dõi đơn (F02, ADR-0010): Socket.IO, chỉ transport websocket nên nhiều instance
# phía sau không cần sticky session. Thiếu Upgrade/Connection → client không nối được.
location /socket.io/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;

    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Socket rảnh vẫn giữ (Socket.IO ping mỗi 25s); mặc định 60s vẫn đủ nhưng để dư.
    proxy_read_timeout 120s;
}
