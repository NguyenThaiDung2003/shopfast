# Production trên một EC2 (ADR-0013): nginx + blue-green API + postgres + redis.
#
# Không có file .env và không có secret ở đây: API tự nạp từ SSM khi khởi động, Postgres/Redis nhận
# qua `secrets-agent`. Compose chỉ cần biến không bí mật từ shell (user-data hoặc pipeline):
#   DOMAIN, AWS_REGION, API_IMAGE, WEB_IMAGE, IMAGE_TAG
#
# Mạng:
#   edge     nginx <-> api, API có đường ra Internet (SMTP, LLM, SSM)
#   backend  internal: api <-> postgres/redis, không có đường ra Internet
#   egress   việc chỉ cần gọi ra ngoài (secrets-agent, certbot, migrate)
# Chỉ nginx có `ports`.
#
# Quy trình deploy và đổi màu: infra/README.md.
name: shopfast-prod

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '5'

x-api-image: &api-image
  image: ${API_IMAGE:?Cần đặt API_IMAGE}:${IMAGE_TAG:?Cần đặt IMAGE_TAG}

x-api-env: &api-env
  NODE_ENV: production
  APP_VERSION: ${IMAGE_TAG}
  AWS_REGION: ${AWS_REGION:?Cần đặt AWS_REGION}
  SSM_PARAMETER_PATH: /shopfast/prod/api
  PORT: 3000
  # Đúng 1 proxy (Nginx) đứng trước API (ADR-0008). Thêm CDN/LB thì phải sửa.
  TRUST_PROXY: 1
  SWAGGER_ENABLED: 'false'
  INVOICE_STORAGE_DIR: /data/invoices

x-api: &api
  <<: [*logging, *api-image]
  restart: unless-stopped
  # Tắt êm (ADR-0012): tini chuyển SIGTERM cho node; Docker chờ lâu hơn SHUTDOWN_TIMEOUT_MS.
  init: true
  stop_grace_period: 35s
  security_opt:
    - no-new-privileges:true
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  environment: *api-env
  volumes:
    - invoices:/data/invoices
  networks: [edge, backend]

services:
  nginx:
    <<: *logging
    image: nginx:1.28-alpine
    restart: unless-stopped
    init: true
    depends_on:
      web:
        condition: service_completed_successfully
    environment:
      DOMAIN: ${DOMAIN:?Cần đặt DOMAIN}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/api.conf:/etc/nginx/snippets/api.conf:ro
      - ./nginx/security-headers.conf:/etc/nginx/snippets/security-headers.conf:ro
      # Mount thư mục, không mount active.conf: `mv` thay inode, mount file sẽ giữ bản cũ.
      - ./nginx/upstream:/etc/nginx/upstream:ro
      - ./nginx/watch-certs.sh:/docker-entrypoint.d/90-watch-certs.sh:ro
      - web_static:/usr/share/nginx/html:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    networks: [edge]
    healthcheck:
      test: ['CMD-SHELL', 'nginx -t -q']
      interval: 30s
      timeout: 5s
      retries: 3

  # Chỉ bật một màu; đặt tên service khi `up` sẽ tự kích hoạt profile của nó.
  api-blue:
    <<: *api
    profiles: [blue]

  api-green:
    <<: *api
    profiles: [green]

  # Chạy một lần trước khi bật màu mới: docker compose run --rm migrate
  migrate:
    <<: [*logging, *api-image]
    profiles: [tools]
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
    environment: *api-env
    command: ['npx', 'prisma', 'migrate', 'deploy']
    networks: [egress, backend]

  postgres:
    <<: *logging
    image: postgres:16-alpine
    restart: unless-stopped
    stop_grace_period: 60s
    depends_on:
      secrets-agent:
        condition: service_healthy
    environment:
      POSTGRES_USER: shopfast
      POSTGRES_DB: shopfast
      POSTGRES_PASSWORD_FILE: /run/shopfast/postgres/postgres_password
    volumes:
      - pgdata:/var/lib/postgresql/data
      - pg_secrets:/run/shopfast/postgres:ro
    networks: [backend]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shopfast -d shopfast']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    <<: *logging
    image: redis:7-alpine
    restart: unless-stopped
    depends_on:
      secrets-agent:
        condition: service_healthy
    command: ['redis-server', '/run/shopfast/redis/redis.conf']
    volumes:
      - redisdata:/data
      - redis_secrets:/run/shopfast/redis:ro
    networks: [backend]
    healthcheck:
      # Không có mật khẩu trong healthcheck: NOAUTH nghĩa là server vẫn đang trả lời.
      test: ['CMD-SHELL', "redis-cli ping | grep -qE 'PONG|NOAUTH'"]
      interval: 5s
      timeout: 3s
      retries: 10

  secrets-agent:
    <<: *logging
    image: amazon/aws-cli:2.27.50
    restart: unless-stopped
    init: true
    entrypoint: ['/bin/sh', '/opt/secrets-agent.sh']
    environment:
      AWS_REGION: ${AWS_REGION}
      SSM_PARAMETER_PREFIX: /shopfast/prod
    volumes:
      - ./secrets/secrets-agent.sh:/opt/secrets-agent.sh:ro
      - pg_secrets:/run/shopfast/postgres
      - redis_secrets:/run/shopfast/redis
    networks: [egress]
    healthcheck:
      test:
        - CMD-SHELL
        - test -s /run/shopfast/postgres/postgres_password && test -s /run/shopfast/redis/redis.conf
      interval: 2s
      timeout: 2s
      retries: 30

  # Chạy một lần: đổ bản build vào `web_static`, không cần khởi động lại nginx.
  web:
    <<: *logging
    image: ${WEB_IMAGE:?Cần đặt WEB_IMAGE}:${IMAGE_TAG}
    restart: 'no'
    network_mode: none
    volumes:
      - web_static:/srv/web

  certbot:
    <<: *logging
    image: certbot/certbot:v4.2.0
    restart: unless-stopped
    init: true
    entrypoint:
      - /bin/sh
      - -c
      - |
        while :; do
          certbot renew --webroot -w /var/www/certbot --deploy-hook 'touch /etc/letsencrypt/.renewed'
          sleep 12h
        done
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    networks: [egress]

networks:
  edge:
  backend:
    internal: true
  egress:

# Secret chỉ nằm trong RAM; size nhỏ vì chỉ chứa vài file.
x-secret-volume: &secret-volume
  driver: local
  driver_opts:
    type: tmpfs
    device: tmpfs
    o: size=1m,mode=0755

volumes:
  pgdata:
  redisdata:
  invoices:
  web_static:
  letsencrypt:
  certbot_www:
  pg_secrets: *secret-volume
  redis_secrets: *secret-volume
