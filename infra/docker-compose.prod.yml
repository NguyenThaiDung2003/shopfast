# Production trên một EC2 (ADR-0013): nginx + blue-green API + postgres + redis.
#
# Secret và cấu hình nằm ở infra/.env (Compose tự đọc, tạo bằng scripts/init-env.sh).
# Deploy bằng scripts/deploy.sh; IMAGE_TAG do script đặt theo commit.
#
# Mạng:
#   edge     nginx <-> api, API có đường ra Internet (SMTP, LLM)
#   backend  internal: api <-> postgres/redis, không có đường ra Internet
#   egress   certbot gọi Let's Encrypt
# Chỉ nginx có `ports`.
name: shopfast-prod

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '5'

x-api-image: &api-image
  image: shopfast-api:${IMAGE_TAG:-latest}
  env_file: .env

x-api-env: &api-env
  NODE_ENV: production
  APP_VERSION: ${IMAGE_TAG:-latest}
  GIT_COMMIT: ${IMAGE_TAG:-latest}
  PORT: 3000
  DATABASE_URL: postgresql://shopfast:${POSTGRES_PASSWORD:?Thiếu POSTGRES_PASSWORD trong infra/.env}@postgres:5432/shopfast?schema=public
  REDIS_URL: redis://:${REDIS_PASSWORD:?Thiếu REDIS_PASSWORD trong infra/.env}@redis:6379
  # Đúng 1 proxy (Nginx) đứng trước API (ADR-0008). Thêm CDN/LB thì phải sửa.
  TRUST_PROXY: 1
  SWAGGER_ENABLED: 'false'
  INVOICE_STORAGE_DIR: /data/invoices

x-api: &api
  <<: [*logging, *api-image]
  restart: unless-stopped
  # Tắt êm (ADR-0012): tini chuyển SIGTERM cho node; Docker chờ lâu hơn SHUTDOWN_TIMEOUT_MS.
  init: true
  stop_grace_period: 35s
  security_opt:
    - no-new-privileges:true
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  environment: *api-env
  volumes:
    - invoices:/data/invoices
  networks: [edge, backend]

services:
  nginx:
    <<: *logging
    image: nginx:1.28-alpine
    restart: unless-stopped
    init: true
    depends_on:
      web:
        condition: service_completed_successfully
    environment:
      DOMAIN: ${DOMAIN:?Thiếu DOMAIN trong infra/.env}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/api.conf:/etc/nginx/snippets/api.conf:ro
      - ./nginx/security-headers.conf:/etc/nginx/snippets/security-headers.conf:ro
      # Mount thư mục, không mount active.conf: `mv` thay inode, mount file sẽ giữ bản cũ.
      - ./nginx/upstream:/etc/nginx/upstream:ro
      - ./nginx/watch-certs.sh:/docker-entrypoint.d/90-watch-certs.sh:ro
      - web_static:/usr/share/nginx/html:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    networks: [edge]
    healthcheck:
      test: ['CMD-SHELL', 'nginx -t -q']
      interval: 30s
      timeout: 5s
      retries: 3

  # Chỉ bật một màu; đặt tên service khi `up` sẽ tự kích hoạt profile của nó.
  api-blue:
    <<: *api
    profiles: [blue]

  api-green:
    <<: *api
    profiles: [green]

  # Chạy một lần trước khi bật màu mới, deploy.sh tự gọi.
  migrate:
    <<: [*logging, *api-image]
    profiles: [tools]
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
    environment: *api-env
    command: ['npx', 'prisma', 'migrate', 'deploy']
    networks: [backend]

  postgres:
    <<: *logging
    image: postgres:16-alpine
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      POSTGRES_USER: shopfast
      POSTGRES_DB: shopfast
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U shopfast -d shopfast']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    <<: *logging
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --requirepass
      - ${REDIS_PASSWORD}
    environment:
      # redis-cli đọc mật khẩu từ biến này, tránh lộ mật khẩu trên dòng lệnh healthcheck.
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    networks: [backend]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # Chạy một lần: đổ bản build vào `web_static`, không cần khởi động lại nginx.
  web:
    <<: *logging
    image: shopfast-web:${IMAGE_TAG:-latest}
    restart: 'no'
    network_mode: none
    volumes:
      - web_static:/srv/web

  certbot:
    <<: *logging
    image: certbot/certbot:v4.2.0
    restart: unless-stopped
    init: true
    entrypoint:
      - /bin/sh
      - -c
      - |
        while :; do
          certbot renew --webroot -w /var/www/certbot --deploy-hook 'touch /etc/letsencrypt/.renewed'
          sleep 12h
        done
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    networks: [egress]

networks:
  edge:
  backend:
    internal: true
  egress:

volumes:
  pgdata:
  redisdata:
  invoices:
  web_static:
  letsencrypt:
  certbot_www:
