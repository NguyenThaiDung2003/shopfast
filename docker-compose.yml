# Môi trường DEV của ShopFast: api + postgres:16 + redis:7.
# Mọi giá trị nhạy cảm đọc từ file .env ở gốc repo (gitignore, tạo từ .env.example).
#
# VỀ CỔNG (PORT):
# - Postgres và Redis chỉ cần cho api qua mạng nội bộ "backend"; api gọi bằng tên service.
# - Hai cổng 5432/6379 được publish CHỈ ĐỂ PHỤC VỤ DEV (chạy api bằng `pnpm start:dev`,
#   Prisma Studio, seed, psql từ máy host) và chỉ bind vào 127.0.0.1 nên không lộ ra mạng LAN.
# - Môi trường staging/production KHÔNG publish cổng DB/Redis (SRS: không phơi ra Internet);
#   chỉ Nginx mở 80/443.
name: shopfast

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Cần đặt POSTGRES_USER trong .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Cần đặt POSTGRES_PASSWORD trong .env}
      POSTGRES_DB: ${POSTGRES_DB:?Cần đặt POSTGRES_DB trong .env}
    ports:
      - '127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432' # DEV ONLY
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --requirepass
      - ${REDIS_PASSWORD:?Cần đặt REDIS_PASSWORD trong .env}
    environment:
      # redis-cli đọc mật khẩu từ biến này, tránh lộ mật khẩu trên dòng lệnh healthcheck.
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      - '127.0.0.1:${REDIS_HOST_PORT:-6379}:6379' # DEV ONLY
    volumes:
      - redisdata:/data
    networks: [backend]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # SMTP giả cho dev: bắt mọi email (không gửi ra ngoài), xem tại http://127.0.0.1:8025.
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - '127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025' # DEV ONLY – giao diện web
    networks: [backend]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: shopfast-api:dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET:?Cần đặt JWT_SECRET trong .env}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-7}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      OTP_TTL_SECONDS: ${OTP_TTL_SECONDS:-300}
      OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS:-5}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      REDIS_COMMAND_TIMEOUT_MS: ${REDIS_COMMAND_TIMEOUT_MS:-100}
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      CACHE_PRODUCT_TTL_SECONDS: ${CACHE_PRODUCT_TTL_SECONDS:-300}
      CACHE_LIST_TTL_SECONDS: ${CACHE_LIST_TTL_SECONDS:-60}
      CACHE_NEGATIVE_TTL_SECONDS: ${CACHE_NEGATIVE_TTL_SECONDS:-30}
      # Dev gọi thẳng cổng 3000 nên không tin proxy nào; sau Nginx (infra/nginx) đặt 1.
      TRUST_PROXY: ${TRUST_PROXY:-false}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_GLOBAL: ${RATE_LIMIT_GLOBAL:-300/60}
      RATE_LIMIT_LOGIN: ${RATE_LIMIT_LOGIN:-10/60}
      RATE_LIMIT_OTP_SEND: ${RATE_LIMIT_OTP_SEND:-3/300}
      RATE_LIMIT_PROMO_ORDER: ${RATE_LIMIT_PROMO_ORDER:-5/60}
      LOGIN_MAX_FAILED_ATTEMPTS: ${LOGIN_MAX_FAILED_ATTEMPTS:-5}
      LOGIN_FAILURE_WINDOW_SECONDS: ${LOGIN_FAILURE_WINDOW_SECONDS:-900}
      LOGIN_LOCKOUT_STEPS_SECONDS: ${LOGIN_LOCKOUT_STEPS_SECONDS:-60,300,1800}
      # Background jobs (F05, ADR-0009). Email đi qua Mailpit ở dev; production đặt SMTP thật.
      QUEUE_WORKERS_ENABLED: ${QUEUE_WORKERS_ENABLED:-true}
      QUEUE_BACKOFF_BASE_MS: ${QUEUE_BACKOFF_BASE_MS:-2000}
      PAYMENT_REMINDER_DELAY_MS: ${PAYMENT_REMINDER_DELAY_MS:-1800000}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-ShopFast <no-reply@shopfast.local>}
      INVOICE_STORAGE_DIR: /data/invoices
      PARTNER_FAILURE_RATE: ${PARTNER_FAILURE_RATE:-0.3}
      REPORT_TIMEZONE: ${REPORT_TIMEZONE:-Asia/Ho_Chi_Minh}
      # Realtime (F02, ADR-0010): Socket.IO tại /socket.io, đồng bộ nhiều instance qua Redis.
      WS_MAX_SUBSCRIPTIONS: ${WS_MAX_SUBSCRIPTIONS:-50}
      # Support & trợ lý AI (F06, ADR-0011). Khoá lấy từ .env, không ghi ở đây.
      LLM_PROVIDER: ${LLM_PROVIDER:-disabled}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-20000}
      AGENT_MAX_TOOL_ROUNDS: ${AGENT_MAX_TOOL_ROUNDS:-5}
      AGENT_TIMEOUT_MS: ${AGENT_TIMEOUT_MS:-45000}
      RATE_LIMIT_AI_ASSISTANT: ${RATE_LIMIT_AI_ASSISTANT:-20/60}
      RATE_LIMIT_TICKET_CREATE: ${RATE_LIMIT_TICKET_CREATE:-5/300}
      SEED_USER_PASSWORD: ${SEED_USER_PASSWORD:-}
    ports:
      - '127.0.0.1:${API_HOST_PORT:-3000}:3000'
    volumes:
      - invoices:/data/invoices
    networks: [backend]
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:3000/api/health > /dev/null || exit 1']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s

networks:
  backend:

volumes:
  pgdata:
  redisdata:
  invoices:
